[project]
name = "free-proxy"
version = "0.1.0"
description = "Self-hosted free residential proxy discovery and SOCKS5 gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.4",
    "fastapi>=0.116.0",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
free-proxy = "free_proxy.cli:app"

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "mypy>=1.16.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.2",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "install.sh",
]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
