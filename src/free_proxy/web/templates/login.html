<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 | {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">FREE PROXY CONTROL</p>
    <h1>管理登录</h1>
    <p>登录后管理免费出口节点和本地 SOCKS5 网关。</p>
    <form id="login-form">
      <label>账号<input id="username" autocomplete="username" required></label>
      <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary-action" type="submit">登录</button>
      <p id="login-error" class="form-error"></p>
    </form>
  </main>
  <script type="module" src="{{ url_for('static', path='/login.js') }}"></script>
</body>
</html>
