<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">SELF-HOSTED EXIT POOL</p>
        <h1>Free Proxy</h1>
        <p class="hero-copy">发现公开免费出口，筛选住宅、移动和机房 IP，并统一提供本地 SOCKS5 与 HTTP 代理。</p>
      </div>
      <div class="hero-actions">
        <button id="refresh-button" class="primary-action" type="button">更新并检测节点</button>
        <button id="logout-button" class="quiet-action" type="button">退出</button>
      </div>
    </header>

    <main>
      <section class="status-grid" aria-label="运行状态">
        <article class="metric-card"><span>服务状态</span><strong id="service-status">连接中</strong></article>
        <article class="metric-card"><span>候选出口</span><strong id="node-count">0</strong></article>
        <article class="metric-card"><span>当前出口</span><strong id="active-node">未连接</strong></article>
        <article class="metric-card"><span>出口 IP</span><strong id="exit-ip">-</strong></article>
        <article class="metric-card"><span>活动延迟</span><strong id="active-latency">-</strong></article>
        <article class="metric-card"><span>SOCKS5</span><strong id="socks-listener">127.0.0.1:1080</strong></article>
        <article class="metric-card"><span>HTTP</span><strong id="http-listener">127.0.0.1:8080</strong></article>
        <article class="metric-card"><span>任务状态</span><strong id="job-message">等待操作</strong></article>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div><p class="section-label">PROXY POOL</p><h2>免费出口节点</h2></div>
          <div class="inline-actions">
            <button id="probe-selected-button" class="quiet-action" type="button">测试选中</button>
            <button id="health-button" class="quiet-action" type="button">检测出口</button>
            <button id="disconnect-button" class="danger-action" type="button">断开连接</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th></th><th>收藏</th><th>国家</th><th>IP 地址</th><th>协议</th><th>类型</th><th>延迟</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="proxy-table-body"><tr><td colspan="9" class="empty-state">尚未发现节点</td></tr></tbody>
          </table>
        </div>
      </section>

      <div class="two-column">
        <section class="panel">
          <div class="panel-heading"><div><p class="section-label">ROUTING</p><h2>出口设置</h2></div></div>
          <form id="settings-form" class="form-grid">
            <label>路由模式<select id="routing-mode"><option value="auto">自动</option><option value="fixed">固定节点</option><option value="country">固定国家</option><option value="favorites">仅收藏</option></select></label>
            <label>固定国家<select id="force-country"><option value="">不限</option></select></label>
            <label>IP 类型<select id="routing-ip-type"><option value="all">全部</option><option value="residential">住宅/移动</option><option value="hosting">机房</option></select></label>
            <label>固定节点<input id="fixed-node-id" placeholder="节点 ID"></label>
            <label class="check-label"><input id="connection-enabled" type="checkbox">允许自动连接</label>
            <button class="primary-action" type="submit">保存设置</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel-heading"><div><p class="section-label">ADMIN</p><h2>管理账号</h2></div></div>
          <form id="credentials-form" class="form-grid">
            <label>账号<input id="admin-username" required></label>
            <label>新密码<input id="admin-password" type="password" placeholder="留空保持不变"></label>
            <label>安全路径<input id="admin-secret-path" pattern="[A-Za-z0-9]+" required></label>
            <label>监听地址<input id="admin-host" required></label>
            <label>管理端口<input id="admin-port" type="number" min="1" max="65535" required></label>
            <button class="primary-action" type="submit">保存管理配置</button>
          </form>
        </section>
      </div>

      <section class="panel">
        <div class="panel-heading">
          <div><p class="section-label">LOGS</p><h2>运行日志</h2></div>
          <div class="inline-actions">
            <select id="log-level" aria-label="日志级别"><option value="">全部级别</option><option value="INFO">INFO</option><option value="WARNING">WARNING</option><option value="ERROR">ERROR</option></select>
            <input id="log-module" aria-label="日志模块" placeholder="模块过滤">
            <button id="export-logs-button" class="quiet-action" type="button">导出</button>
            <button id="reload-logs-button" class="quiet-action" type="button">刷新日志</button>
          </div>
        </div>
        <div id="log-list" class="log-list"><p class="empty-state">暂无日志</p></div>
      </section>
    </main>
  </div>
  <script type="module" src="{{ url_for('static', path='/app.js') }}"></script>
</body>
</html>
